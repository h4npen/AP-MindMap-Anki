<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧠 AP MindMap Anki - オフライン復習アプリ</title>
  <style>
    /* ========================================================
       Neubrutalism Design System - Standalone Offline App
       ======================================================== */
    :root {
      color-scheme: light;
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #0f172a;
      --border-width: 2.5px;
      --shadow-offset: 3px;
      --shadow-style: var(--shadow-offset) var(--shadow-offset) 0 var(--border-color);
      --accent-cyan: #38bdf8;
      --accent-yellow: #fde047;
      --accent-green: #4ade80;
      --accent-pink: #f472b6;
      --accent-purple: #e9d5ff;
      --text-main: #0f172a;
      --text-muted: #334155;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      line-height: 1.6;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: var(--text-main);
      font-size: inherit;
    }

    button {
      user-select: none;
      touch-action: manipulation;
      cursor: pointer;
    }

    /* HEADER */
    .app-header {
      background: #ffffff;
      border-bottom: var(--border-width) solid var(--border-color);
      box-shadow: 0 2px 0 var(--border-color);
      z-index: 50;
      flex-shrink: 0;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .logo-icon {
      font-size: 1.5rem;
      background: var(--accent-yellow);
      border: var(--border-width) solid var(--border-color);
      border-radius: 8px;
      padding: 2px 6px;
      box-shadow: 2px 2px 0 var(--border-color);
      line-height: 1;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .offline-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      background: var(--accent-green);
      color: #064e3b;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1.5px solid var(--border-color);
      width: fit-content;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1.5px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .progress-bar-bg {
      width: 70px;
      height: 8px;
      background: #cbd5e1;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-green);
      width: 0%;
      transition: width 0.3s ease;
    }

    .mobile-nav-toggle {
      display: none;
      padding: 6px 12px;
      background: var(--accent-cyan);
      border: var(--border-width) solid var(--border-color);
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 2px 2px 0 var(--border-color);
    }

    /* MAIN LAYOUT */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* SIDEBAR (QUESTION LIST) */
    .sidebar {
      width: 380px;
      background: #ffffff;
      border-right: var(--border-width) solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-controls {
      padding: 12px;
      background: #f8fafc;
      border-bottom: var(--border-width) solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: var(--border-width) solid var(--border-color);
      border-radius: 6px;
      box-shadow: 2px 2px 0 var(--border-color);
      font-weight: 600;
      font-size: 0.9rem;
      outline: none;
    }
    .search-input:focus {
      background: #fffbeb;
    }

    .filter-row {
      display: flex;
      gap: 6px;
    }

    .category-select {
      flex: 1;
      padding: 6px 8px;
      border: var(--border-width) solid var(--border-color);
      border-radius: 6px;
      box-shadow: 2px 2px 0 var(--border-color);
      font-weight: 700;
      font-size: 0.82rem;
      background: #ffffff;
      cursor: pointer;
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note-item {
      background: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--border-color);
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s;
      position: relative;
    }

    .note-item:hover {
      transform: translateY(-1px);
      box-shadow: 3px 3px 0 var(--border-color);
      background-color: #f8fafc;
    }

    .note-item.active {
      background-color: #eff6ff;
      border-color: #2563eb;
      box-shadow: 3px 3px 0 #2563eb;
    }

    .note-item.completed {
      opacity: 0.75;
      background-color: #f0fdf4;
    }

    .note-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .note-category-tag {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 1px 6px;
      background: var(--accent-yellow);
      border: 1.5px solid var(--border-color);
      border-radius: 4px;
      white-space: nowrap;
    }

    .check-btn {
      background: none;
      border: none;
      font-size: 1.15rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px;
    }

    .note-item-title {
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1.35;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .note-item-meta {
      margin-top: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* CONTENT VIEWER */
    .content-viewer {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .viewer-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 2px dashed #cbd5e1;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 800;
      border: var(--border-width) solid var(--border-color);
      border-radius: 6px;
      box-shadow: 2px 2px 0 var(--border-color);
      background: #ffffff;
      transition: all 0.1s ease;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 3px 3px 0 var(--border-color);
    }
    .btn:active:not(:disabled) {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--border-color);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-complete {
      background: var(--accent-green);
    }
    .btn-complete.active {
      background: #dcfce7;
      border-style: dashed;
    }

    /* MARKDOWN STYLING */
    .markdown-body {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      font-size: 1rem;
      line-height: 1.75;
      color: #1e293b;
    }

    .markdown-body h1 {
      font-size: 1.55rem;
      font-weight: 900;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 3px solid var(--border-color);
      letter-spacing: -0.02em;
    }

    .markdown-body h2 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-top: 24px;
      margin-bottom: 12px;
      padding: 4px 10px;
      background: #f1f5f9;
      border-left: 6px solid var(--accent-cyan);
      border-radius: 0 6px 6px 0;
    }

    .markdown-body h3 {
      font-size: 1.1rem;
      font-weight: 800;
      margin-top: 18px;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .markdown-body p {
      margin-bottom: 14px;
    }

    .markdown-body strong {
      font-weight: 800;
      color: #0f172a;
      background: linear-gradient(transparent 65%, #fde047 65%);
    }

    .markdown-body blockquote {
      border: var(--border-width) solid var(--border-color);
      border-left: 8px solid var(--border-color);
      background: #fffbeb;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      box-shadow: 2px 2px 0 var(--border-color);
      font-size: 0.95rem;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 6px;
    }

    .markdown-body details {
      border: var(--border-width) solid var(--border-color);
      border-radius: 8px;
      background: #f0fdf4;
      padding: 12px 16px;
      margin: 16px 0;
      box-shadow: 3px 3px 0 var(--border-color);
    }

    .markdown-body summary {
      font-weight: 800;
      cursor: pointer;
      font-size: 1.05rem;
      color: #166534;
      outline: none;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 0.9rem;
      border: 2px solid var(--border-color);
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-body th {
      background: #f8fafc;
      font-weight: 800;
      border-bottom: 2px solid var(--border-color);
    }

    .markdown-body pre {
      background: #1e293b;
      color: #f8fafc;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      font-size: 0.88rem;
      border: 2px solid var(--border-color);
    }

    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      color: #b91c1c;
      font-weight: 700;
    }

    .markdown-body pre code {
      background: none;
      padding: 0;
      border: none;
      color: inherit;
      font-weight: normal;
    }

    .mermaid-container {
      background: #ffffff;
      border: var(--border-width) solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin: 20px 0;
      box-shadow: 3px 3px 0 var(--border-color);
      overflow-x: auto;
      text-align: center;
    }

    /* EMPTY STATE */
    .empty-state {
      margin: auto;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      .mobile-nav-toggle {
        display: block;
      }
      .progress-box {
        display: none;
      }
      .sidebar {
        position: absolute;
        top: 57px;
        left: 0;
        bottom: 0;
        width: 100%;
        z-index: 40;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .content-viewer {
        padding: 16px 14px;
      }
      .viewer-header-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .nav-buttons {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo-area" onclick="showAllList()">
        <div class="logo-icon">🧠</div>
        <div class="logo-text">
          <div class="logo-title">AP MindMap Anki</div>
          <span class="offline-badge">⚡ 完全オフライン版 (新幹線・移動用)</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="progress-box">
          <span>進捗: <span id="progress-text">0 / 0 (0%)</span></span>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>
        </div>
        <button class="mobile-nav-toggle" id="mobile-toggle-btn" onclick="toggleSidebar()">
          📋 問題リスト
        </button>
      </div>
    </div>
  </header>

  <!-- BODY -->
  <div class="app-body">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-controls">
        <input type="text" class="search-input" id="search-input" placeholder="🔍 キーワード・過去問で検索..." oninput="handleSearch()">
        <div class="filter-row">
          <select class="category-select" id="category-select" onchange="handleCategoryChange()">
            <option value="all">📂 すべての分野 (全問)</option>
          </select>
        </div>
      </div>
      <div class="notes-list" id="notes-list">
        <!-- JS rendered items -->
      </div>
    </aside>

    <!-- CONTENT VIEWER -->
    <main class="content-viewer" id="content-viewer">
      <div class="viewer-header-bar" id="viewer-header" style="display: none;">
        <div class="nav-buttons">
          <button class="btn" id="prev-btn" onclick="goToPrevNote()">← 前の問題</button>
          <button class="btn" id="next-btn" onclick="goToNextNote()">次の問題 →</button>
        </div>
        <button class="btn btn-complete" id="complete-toggle-btn" onclick="toggleCurrentComplete()">
          ☑️ 完了にする
        </button>
      </div>
      <div class="markdown-body" id="markdown-output">
        <div class="empty-state">
          <div class="empty-icon">👈</div>
          <h2>左のリストから問題を選択してください</h2>
          <p>新幹線などの電波が届かない場所でも、全98問の解説と図をオフラインで復習できます。</p>
        </div>
      </div>
    </main>
  </div>

  <!-- INLINE SCRIPTS (Marked + Mermaid) -->
  <script>
    /* __MARKED_JS__ */
    if (typeof marked !== 'undefined') {
      marked.setOptions({
        breaks: true,
        gfm: true
      });
    }
  </script>
  <script>
    /* __MERMAID_JS__ */
  </script>

  <!-- APPLICATION LOGIC -->
  <script>
    // Embedded Data
    const ALL_NOTES = /* __NOTES_JSON__ */;

    // App State
    let selectedCategoryId = 'all';
    let searchQuery = '';
    let activeNoteId = null;
    let completedSet = new Set();

    // Initialize LocalStorage for completion
    try {
      const saved = localStorage.getItem('ap_offline_completed_notes') || localStorage.getItem('ap_completed_notes');
      if (saved) {
        completedSet = new Set(JSON.parse(saved));
      }
    } catch (e) {
      console.error(e);
    }

    // Mermaid init
    mermaid.initialize({
      startOnLoad: false,
      theme: 'neutral',
      securityLevel: 'loose',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif',
      fontSize: 13
    });

    // Populate Categories Dropdown
    function initCategories() {
      const select = document.getElementById('category-select');
      const catMap = new Map();
      ALL_NOTES.forEach(n => {
        if (!catMap.has(n.categoryNumber)) {
          catMap.set(n.categoryNumber, n.categoryName);
        }
      });

      const sorted = Array.from(catMap.entries()).sort((a, b) => a[0].localeCompare(b[0]));
      sorted.forEach(([num, name]) => {
        const opt = document.createElement('option');
        opt.value = num;
        opt.textContent = `${num}. ${name}`;
        select.appendChild(opt);
      });
    }

    // Filter Notes
    function getFilteredNotes() {
      return ALL_NOTES.filter(note => {
        if (selectedCategoryId !== 'all' && note.categoryNumber !== selectedCategoryId) {
          return false;
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const matchTitle = note.title.toLowerCase().includes(q);
          const matchExam = note.targetExam.toLowerCase().includes(q);
          const matchCat = note.categoryName.toLowerCase().includes(q);
          const matchContent = note.content.toLowerCase().includes(q);
          if (!matchTitle && !matchExam && !matchCat && !matchContent) return false;
        }
        return true;
      });
    }

    // Render Note List
    function renderNoteList() {
      const listContainer = document.getElementById('notes-list');
      const filtered = getFilteredNotes();
      listContainer.innerHTML = '';

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div style="padding:20px; text-align:center; color:#64748b; font-size:0.9rem;">該当する問題がありません</div>';
        return;
      }

      filtered.forEach(note => {
        const isCompleted = completedSet.has(note.id);
        const isActive = note.id === activeNoteId;

        const item = document.createElement('div');
        item.className = `note-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
        item.onclick = () => selectNote(note.id);

        item.innerHTML = `
          <div class="note-item-header">
            <span class="note-category-tag">${note.categoryNumber}. ${note.categoryName}</span>
            <button class="check-btn" onclick="toggleItemComplete('${note.id}', event)">
              ${isCompleted ? '✅' : '⬜'}
            </button>
          </div>
          <div class="note-item-title">${note.title}</div>
          <div class="note-item-meta">
            <span>${note.targetExam || ''}</span>
            <span>⏱️ ${note.readingTime}</span>
          </div>
        `;
        listContainer.appendChild(item);
      });

      updateProgress();
    }

    // Update Progress Bar
    function updateProgress() {
      const total = ALL_NOTES.length;
      const done = completedSet.size;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById('progress-text').textContent = `${done} / ${total} (${pct}%)`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    // Clean LaTeX syntax
    function cleanLatex(text) {
      return text
        .replace(/\$\\rightarrow\$/g, '→')
        .replace(/\\rightarrow/g, '→')
        .replace(/\\leftarrow/g, '←')
        .replace(/\$\\frac\{([^}]+)\}\{([^}]+)\}\$/g, '$1/$2')
        .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '$1/$2')
        .replace(/\\times/g, '×')
        .replace(/\\div/g, '÷')
        .replace(/\\mathbf\{([^}]+)\}/g, '**$1**')
        .replace(/\\text\{([^}]+)\}/g, '$1')
        .replace(/\$\$([\s\S]*?)\$\$/g, (_, p1) => `\n> ${p1.trim()}\n`)
        .replace(/\$([0-9a-zA-Z\s+\-*/%./=]+)\$/g, '$1');
    }

    // Select Note
    async function selectNote(id) {
      activeNoteId = id;
      const note = ALL_NOTES.find(n => n.id === id);
      if (!note) return;

      // Close mobile sidebar if open
      document.getElementById('sidebar').classList.remove('open');

      // Update Nav Buttons
      document.getElementById('viewer-header').style.display = 'flex';
      const filtered = getFilteredNotes();
      const currIdx = filtered.findIndex(n => n.id === id);
      document.getElementById('prev-btn').disabled = currIdx <= 0;
      document.getElementById('next-btn').disabled = currIdx < 0 || currIdx >= filtered.length - 1;

      // Complete toggle btn
      updateCompleteButtonState();

      // Render Markdown
      const cleaned = cleanLatex(note.content);
      const output = document.getElementById('markdown-output');

      // Replace mermaid codeblocks with placeholders
      const mermaidBlocks = [];
      const markedText = cleaned.replace(/```mermaid\s*\n([\s\S]*?)\n```/g, (_, code) => {
        mermaidBlocks.push(code.trim());
        return `<div class="mermaid-container" data-mermaid-idx="${mermaidBlocks.length - 1}"></div>`;
      });

      output.innerHTML = marked.parse(markedText);

      // Render all Mermaid blocks
      const containers = output.querySelectorAll('.mermaid-container');
      for (let el of containers) {
        const idx = el.getAttribute('data-mermaid-idx');
        const code = mermaidBlocks[idx];
        if (code) {
          try {
            const id = 'mermaid-svg-' + Math.random().toString(36).substr(2, 9);
            const { svg } = await mermaid.render(id, code);
            el.innerHTML = svg;
          } catch (err) {
            el.innerHTML = `<pre style="color:#ef4444; background:#fef2f2; padding:10px; border-radius:6px; font-size:0.8rem;">図の描画エラー:\n${err.message}</pre>`;
          }
        }
      }

      // Scroll to top
      document.getElementById('content-viewer').scrollTop = 0;

      // Update list active highlights
      renderNoteList();
    }

    function updateCompleteButtonState() {
      const isCompleted = completedSet.has(activeNoteId);
      const btn = document.getElementById('complete-toggle-btn');
      if (isCompleted) {
        btn.textContent = '✅ 完了済み (クリックで戻す)';
        btn.className = 'btn btn-complete active';
      } else {
        btn.textContent = '☑️ 完了にする';
        btn.className = 'btn btn-complete';
      }
    }

    function toggleCurrentComplete() {
      if (!activeNoteId) return;
      toggleItemComplete(activeNoteId);
      updateCompleteButtonState();
    }

    function toggleItemComplete(id, evt) {
      if (evt) evt.stopPropagation();
      if (completedSet.has(id)) {
        completedSet.delete(id);
      } else {
        completedSet.add(id);
      }
      localStorage.setItem('ap_offline_completed_notes', JSON.stringify(Array.from(completedSet)));
      localStorage.setItem('ap_completed_notes', JSON.stringify(Array.from(completedSet)));
      renderNoteList();
      if (id === activeNoteId) {
        updateCompleteButtonState();
      }
    }

    function goToPrevNote() {
      const filtered = getFilteredNotes();
      const currIdx = filtered.findIndex(n => n.id === activeNoteId);
      if (currIdx > 0) {
        selectNote(filtered[currIdx - 1].id);
      }
    }

    function goToNextNote() {
      const filtered = getFilteredNotes();
      const currIdx = filtered.findIndex(n => n.id === activeNoteId);
      if (currIdx >= 0 && currIdx < filtered.length - 1) {
        selectNote(filtered[currIdx + 1].id);
      }
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value;
      renderNoteList();
    }

    function handleCategoryChange() {
      selectedCategoryId = document.getElementById('category-select').value;
      renderNoteList();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function showAllList() {
      document.getElementById('sidebar').classList.add('open');
    }

    // Keyboard navigation (Arrow keys)
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight' || e.key === 'j') goToNextNote();
      if (e.key === 'ArrowLeft' || e.key === 'k') goToPrevNote();
    });

    // Boot
    function openFromHash() {
      const hashId = decodeURIComponent(window.location.hash.replace(/^#/, ''));
      if (!hashId) return false;
      const targetNote = ALL_NOTES.find(n => n.id === hashId || n.filename === hashId);
      if (targetNote) {
        selectNote(targetNote.id);
        return true;
      }
      return false;
    }

    window.addEventListener('hashchange', openFromHash);

    initCategories();
    renderNoteList();
    if (!openFromHash() && ALL_NOTES.length > 0) {
      selectNote(ALL_NOTES[0].id);
    }
  </script>
</body>
</html>
